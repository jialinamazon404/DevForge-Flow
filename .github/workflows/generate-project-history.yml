name: Generate Project History

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-project-history
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate project history
        run: python3 .github/scripts/generate_project_history.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- docs/PROJECT-HISTORY.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="docs/update-project-history"
          default_branch="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add docs/PROJECT-HISTORY.md
          git commit -m "docs: update project history from specs"
          git push --force-with-lease origin "$branch"

          body="Auto-generated project history from $default_branch specs."
          if gh pr view "$branch" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "${{ github.repository }}" \
              --title "docs: update project history from specs" \
              --body "$body"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "$default_branch" \
              --head "$branch" \
              --title "docs: update project history from specs" \
              --body "$body"
          fi
